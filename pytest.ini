[pytest]
testpaths = tests
# Hardware tests are opt-in: pytest -m gpu / -m mic / -m win / -m mac
addopts = -m "not gpu and not mic and not win and not mac"
markers =
    gpu: needs the NVIDIA GPU and the downloaded model
    mic: needs a working microphone
    win: touches the real Windows clipboard
    mac: touches real macOS hardware or permissions (clipboard, keys, model)
filterwarnings =
    ignore:Setting the shape on a NumPy array:DeprecationWarning:sounddevice
